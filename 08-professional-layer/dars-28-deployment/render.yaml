services:
  # 1. FastAPI Web Service
  - type: web
    name: storely-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: storely-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: storely-redis
          property: connectionString

  # 2. Redis Key-Value Store (Celery Broker)
  - type: redis
    name: storely-redis
    ipAllowList: [] # PaaS ichki kirish

databases:
  # 3. PostgreSQL Database
  - name: storely-db
    databaseName: storely
    user: storely_user
    plan: free
