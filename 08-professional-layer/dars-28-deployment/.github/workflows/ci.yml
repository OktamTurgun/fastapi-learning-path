name: FastAPI Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklab olish (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.13 o'rnatish
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Bog'liqliklarni o'rnatish (Dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install -r 08-professional-layer/dars-28-deployment/requirements.txt

    - name: Pytest yordamida avtomatik testlarni bajarish
      run: |
        pytest 08-professional-layer/dars-28-deployment/tests
